#This Name of the workflow is "FastAPI CI"
name: FastAPI CI

# Workflow triggers on push to the dev branch
on:
  push:
    branches:
      - dev

# Workflow permissions for the job
permissions:
  contents: read
  packages: write

# Workflow jobs
jobs:
  test:
    # Run the job on the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Steps to execute in the job
    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install -r app/requirements.txt

      # Step 4: Run tests using pytest
      - name: Run tests
        run: pytest
        working-directory: app

      # Step 5: Log in to GitHub Container Registry (GHCR)
      - name: Log in GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Build Docker image
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:latest ./app

      # Step 7: Push Docker image to GHCR
      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:latest

      # Step 8: Trigger Render deployment using the deployment hook
      - name: Trigger Render deployment
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK }}"
