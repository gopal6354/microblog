#This Name of the workflow is "FastAPI CI"
name: FastAPI CI

# Workflow triggers on push to the dev branch and main branch, and on pull requests targeting these branches
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

# Workflow permissions for the job
permissions:
  contents: read
  packages: write

# Workflow jobs
jobs:
  test:
    # Run the job on the latest Ubuntu runner
    runs-on: ubuntu-latest

    # Steps to execute in the job
    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Check Python Syntax
        run:  python -m compileall -q app

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install -r app/requirements.txt

      # Step 4: Run tests using pytest
      - name: Run tests
        run: pytest
        working-directory: app

      # Step 5: Log in to GitHub Container Registry (GHCR)
      - name: Log in GHCR
        # Only log in to GHCR if the event is a push to the dev branch
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Build Docker image
      - name: Build Docker image
        # # Build the Docker image on pushes to dev or main
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${{ github.repository}}"

          docker build -t "$IMAGE:${{ github.ref_name }}" ./app

          if [ "${{ github.ref_name }}" == "dev" ]; then
            docker tag "$IMAGE:dev" "$IMAGE:latest"
          fi

      # Step 7: Push Docker image to GHCR
      - name: Push Docker image
        # Push the Docker image on pushes to dev or main
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${{ github.repository}}"

          docker push "$IMAGE:${{ github.ref_name }}"

          if [ "${{ github.ref_name }}" == "dev" ]; then
            docker push "$IMAGE:latest"
          fi

      # Step 8: Trigger Render deployment using the deployment hook
      - name: Trigger Render deployment
        # Only trigger the Render deployment if the event is a push to the dev branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK }}"
