<article class="post-card">

    <div class="post-content">

        <h5>
            {{ blog.content[:50] }}
        </h5>

        <p>
            {{ blog.content }}
        </p>


        {% if blog.image %}

        <img src="{{ url_for('static', path=blog.image) }}" class="img-fluid rounded" alt="Blog image">

        {% endif %}


        <small class="text-body-secondary">
            {{ blog.created_at.strftime("%d %b %Y") }}
        </small>

    </div>


    <div class="post-actions">

        <div class="d-flex gap-2 mt-3">

            <a href="/user-blog/{{ blog.id }}/edit" class="btn btn-sm btn-primary">
                <i class="bi bi-pencil"></i> Edit
            </a>

            <form action="/user-blog/{{ blog.id }}/delete" method="POST">

                <button type="submit" class="btn btn-sm btn-danger"
                    onclick="return confirm('Are you sure you want to delete this post?')">

                    <i class="bi bi-trash"></i> Delete

                </button>

            </form>

        </div>

    </div>

</article>
