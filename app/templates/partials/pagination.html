{# expects `pagination` (utils.pagination.Page); keeps other query params like ?tab= #}
{% if pagination and pagination.total_pages > 1 %}

<nav class="mt-4" aria-label="Pagination">

    <ul class="pagination justify-content-center flex-wrap">

        <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
            <a class="page-link" href="{{ request.url.include_query_params(page=pagination.page - 1) }}"
                aria-label="Previous">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>

        {% for p in pagination.page_numbers() %}
        {% if p is none %}
        <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
        {% else %}
        <li class="page-item {% if p == pagination.page %}active{% endif %}">
            <a class="page-link" href="{{ request.url.include_query_params(page=p) }}">{{ p }}</a>
        </li>
        {% endif %}
        {% endfor %}

        <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
            <a class="page-link" href="{{ request.url.include_query_params(page=pagination.page + 1) }}"
                aria-label="Next">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>

    </ul>

</nav>

{% endif %}
