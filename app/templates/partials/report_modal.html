<div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <form method="post" action="/report/blog">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Report Blog
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <!-- Blog ID will come from button -->
                    <input type="hidden" name="blog_id" id="reportBlogId">


                    <div class="mb-3">

                        <label class="form-label">
                            Reason
                        </label>

                        <select class="form-select" name="reason" required>

                            <option value="Spam">
                                Spam
                            </option>

                            <option value="Harassment">
                                Harassment
                            </option>

                            <option value="Hate Speech">
                                Hate Speech
                            </option>

                            <option value="Copyright">
                                Copyright
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea class="form-control" name="description" rows="4" placeholder="Explain the issue...">
                        </textarea>

                    </div>


                </div>


                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button type="submit" class="btn btn-danger">

                        Submit Report

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>
