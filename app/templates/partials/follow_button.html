{# expects: target_id, following; optional: requested (a pending request to a private account) #}
{% set requested = requested|default(false) %}
<button type="button" class="btn btn-sm rounded-pill follow-btn {% if following or requested %}btn-outline-primary{% else %}btn-primary{% endif %}"
    data-user-id="{{ target_id }}" data-following="{{ 'true' if following else 'false' }}"
    data-requested="{{ 'true' if requested else 'false' }}">
    {% if following %}Following{% elif requested %}Requested{% else %}Follow{% endif %}
</button>
