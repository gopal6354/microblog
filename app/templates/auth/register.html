{% extends "auth/auth_base.html" %}

{% block title %}
EchoHub - Register
{% endblock %}


{% block content %}
<section class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>EchoHub</h1>
            <p>
                Create your account and join the community.
            </p>
        </div>

        <form action="/register" method="POST" autocomplete="on">
            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>
                <input id="username" name="username" type="text" class="form-control" placeholder="Enter your username"
                    autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>
                <input id="email" name="email" type="email" class="form-control" placeholder="Enter your email"
                    autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>
                <input id="password" name="password" type="password" class="form-control"
                    placeholder="Create a password" autocomplete="new-password" required>
            </div>


            <div class="mb-4">
                <label for="confirm_password" class="form-label">
                    Confirm Password
                </label>
                <input id="confirm_password" name="confirm_password" type="password" class="form-control"
                    placeholder="Confirm your password" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="/login">
                    Login
                </a>
            </p>
        </div>
    </div>
</section>

{% endblock %}
