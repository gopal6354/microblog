{% extends "auth/auth_base.html" %}

{% block title %}
EchoHub - Login
{% endblock %}

{% block content %}

<section class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>EchoHub</h1>
            <p>
                Welcome back! Sign in to continue.
            </p>
        </div>

        {% if show_activation_request %}
        <div class="d-grid mb-3">
            <a href="/account-activation-request" class="btn btn-outline-warning">
                Request Account Activation
            </a>
        </div>
        {% endif %}


        <form action="/login" method="POST" autocomplete="on">
            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>
                <input id="email" name="username" type="text" class="form-control"
                    placeholder="Enter your username or email" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>
                <input id="password" name="password" type="password" class="form-control"
                    placeholder="Enter your password" autocomplete="current-password" required>
            </div>

            <div class="auth-options">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">
                        Remember me
                    </label>
                </div>

                <a href="/forget-password">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>
        </form>

        <div class="auth-footer">
            <p>
                Don't have an account?
                <a href="/register">
                    Register
                </a>
            </p>
        </div>
    </div>
</section>

{% endblock %}
