{% extends "auth/auth_base.html" %}

{% block title %}
EchoHub - Verify Reset OTP
{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card">

        <div class="auth-logo">
            <h1>EchoHub</h1>
            <p>
                We've sent a password reset OTP to your email.
                Enter the 6-digit code below to continue.
            </p>
        </div>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form action="/verify-reset-otp" method="POST" autocomplete="off">

            <div class="mb-4">
                <label for="otp" class="form-label">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="otp"
                    name="otp"
                    class="form-control text-center"
                    placeholder="Enter OTP"
                    maxlength="6"
                    minlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Verify OTP
            </button>

        </form>

        <div class="auth-footer mt-4 text-center">

            <p class="mb-2">
                Didn't receive the code?
            </p>

            <form action="/resend-otp" method="POST">
                <button
                    type="submit"
                    class="btn btn-link p-0 text-decoration-none">
                    Resend OTP
                </button>
            </form>

        </div>

    </div>
</section>
{% endblock %}
