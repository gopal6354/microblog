<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EchoHub - Connect, Share and Explore">
    <title>

        {% block title %}
        EchoHub
        {% endblock %}

    </title>

    <!-- Favicon -->
    <!-- <link rel="icon" href="{{ url_for('static', path='images/favicon.ico') }}"> -->

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Global CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='user/css/style.css') }}">
    <!-- Home Layout CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='user/css/home.css') }}">

    <!-- <link rel="stylesheet" href="{{ url_for('static', path='css/user_profile.css')}}"> -->


    <!-- Page Specific CSS -->
    {% block css %}
    {% endblock %}

</head>

<body>

    <div class="app-layout">

        <!-- Left Sidebar -->
        {% include "partials/sidebar.html" %}


        <!-- Main Content -->
        <main class="main-content">

            {% include "partials/flash_messages.html" %}

            {% block content %}
            {% endblock %}

        </main>

        <!-- Right Sidebar -->
        {% include "partials/right_sidebar.html" %}

    </div>


    <!-- Footer -->
    {% include "partials/footer.html" %}



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Global JS -->
    <script src="{{ url_for('static', path='user/js/main.js') }}"></script>


    <!-- Page Specific JS -->
    {% block js %}
    {% endblock %}

</body>
</html>
