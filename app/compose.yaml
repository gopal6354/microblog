# Docker Compose file
services:
# Define the web service for the FastAPI application
  web:
    # Build the Docker image from the Dockerfile in the current directory
    build: .

    # Use the .env file for environment variables
    env_file:
      - .env
    # Set environment variables for the web service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Mount the current directory to /app in the container
    volumes:
      - .:/app
    # Map port 9000 on the host to port 8000 in the container
    ports:
      - "9000:8000"

# Define the database service for PostgreSQL
  db:
    # Use the official PostgreSQL image version 17
    image: postgres:17
    # Use the .env file for environment variables
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Mount a named volume for persistent database storage
    volumes:
      - db_data:/var/lib/postgresql/data
# Define a named volume for the database data
volumes:
  db_data:
